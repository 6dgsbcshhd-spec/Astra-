services:
  - type: web
    name: astra
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString

databases:
  - name: astra-db
    plan: free
    region: frankfurt
